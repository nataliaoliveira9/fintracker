services:
  # ── Django REST API ──────────────────────────────────────────────────────────
  - type: web
    name: fintracker-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /admin/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false # set manually in Render dashboard
      - key: TWELVEDATA_API_KEY
        sync: false # set manually in Render dashboard
      - key: APPDATA_API_KEY
        sync: false # set manually in Render dashboard
      - key: DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "fintracker-backend.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fintracker-frontend.onrender.com,http://localhost:5173"

  # ── React / Vite Static Site ─────────────────────────────────────────────────
  - type: web
    name: fintracker-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA fallback for react-router
    envVars:
      - key: VITE_API_URL
        value: "https://fintracker-backend.onrender.com/api"
