services:
  backend:
    build: ./backend
    restart: always
    environment:
      - DEBUG=0
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost,http://nataliaoliveira.net
    env_file:
      - .env

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: always
